name: zero_inspector_kit
description: A Flutter plugin for in-app developer console with network request viewing, logging, database inspection, memory monitoring, FPS monitoring, and route tracking.
version: 1.4.1
homepage: https://github.com/zero-labsco/zero_inspector_kit
repository: https://github.com/zero-labsco/zero_inspector_kit
documentation: https://zero-labsco.github.io/zero_inspector_kit/

environment:
  sdk: '>=3.9.2 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  http: ^1.2.1
  sqflite: ^2.4.0
  path_provider: ^2.1.3
  # OpenHarmony federated implementation for `path_provider` (harmony_flutter_packages).
  # Provides the OHOS platform backend so the plugin compiles/runs under the OHOS
  # Flutter fork. On Android/iOS/other platforms it is inert (federated plugin
  # only registers its backend where the OHOS toolchain is active).
  # 鸿蒙联邦插件实现层：让插件在鸿蒙 Flutter 分支下能正常调用 path_provider API。
  path_provider_harmonyos: ^0.0.1
  collection: ^1.19.1
  share_plus: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '6.0.0'

flutter:
  plugin:
    platforms:
      android:
        package: com.zerolabsco.zero_inspector_kit
        pluginClass: ZeroInspectorKitPlugin
      ios:
        pluginClass: ZeroInspectorKitPlugin
      ohos:
        package: zero_inspector_kit
        pluginClass: ZeroInspectorKitPlugin