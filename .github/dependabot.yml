# Dependabot 配置 / Dependabot configuration
# 自动检查依赖更新并提交 PR / Automatically check for dependency updates and open PRs
# 文档 / Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2

updates:
  # ========== 根项目 pub 依赖 / Root pub dependencies ==========
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      # 每周一检查更新 / Check for updates every Monday
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Shanghai"
    # 按依赖类型与风险拆分分组，减少审查噪音 / Split groups by dependency type and risk
    groups:
      # 运行时依赖（http、sqflite 等）的 minor/patch 合并到一个 PR
      # Runtime deps (http, sqflite, ...) minor/patch grouped into one PR
      pub-runtime:
        dependency-type: "direct:production"
        update-types:
          - "minor"
          - "patch"
      # 开发依赖（flutter_lints 等）单独一组，更新频率与风险不同
      # Dev deps (flutter_lints, ...) in their own group
      pub-dev:
        dependency-type: "direct:development"
        update-types:
          - "minor"
          - "patch"
      # 大版本始终单独 PR，便于仔细审查破坏性改动
      # Major versions always standalone for careful breaking-change review
      pub-major:
        update-types:
          - "major"
    open-pull-requests-limit: 5
    # 版本约束策略：保留既有 caret(^) 风格，仅提升版本号 / Preserve caret style, bump version only
    versioning-strategy: "increase"
    labels:
      - "dependencies"
      - "pub"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # ⚠️ 注意 / Note: pubspec.yaml 使用 caret 约束（例如 http: ^1.2.1）
    # versioning-strategy: increase 会让 Dependabot 保持 `^` 并仅提升版本号
    # 收到首个 PR 后请验证约束风格未被改为精确版本号
    # This project uses caret (^) constraints in pubspec.yaml (e.g. http: ^1.2.1).
    # `increase` keeps the `^` operator and only bumps the version number.
    # Please verify the caret style is preserved (not changed to exact) after the first PR.

  # ========== Example 应用 pub 依赖 / Example app pub dependencies ==========
  # 示例应用依赖更新频率较低，改为每月 1 号检查一次（实际数月才提一次 PR）
  # Example app deps are updated infrequently → monthly on 1st (rarely actually opens PRs)
  - package-ecosystem: "pub"
    directory: "/example"
    schedule:
      # ⚠️ Dependabot 原生只支持 daily / weekly / monthly；`day` 字段仅 weekly 生效，monthly 下默认月初运行
      # ⚠️ Native options are daily/weekly/monthly only; `day` field only applies to weekly interval
      interval: "monthly"
      timezone: "Asia/Shanghai"
    groups:
      # example 运行时依赖 minor/patch 合并 / Example runtime deps minor/patch grouped
      example-runtime:
        dependency-type: "direct:production"
        update-types:
          - "minor"
          - "patch"
      # example 开发依赖单独一组 / Example dev deps in own group
      example-dev:
        dependency-type: "direct:development"
        update-types:
          - "minor"
          - "patch"
      # example 大版本单独 PR / Example major versions standalone
      example-major:
        update-types:
          - "major"
    # 每月最多提 1 个 PR，example 通常数月才会真正有版本变动 → 实际合并频率远低于 monthly
    # Max 1 PR per month; example deps rarely bump monthly → effective merge rate is far lower
    open-pull-requests-limit: 1
    # 与根项目一致：保留 caret 约束 / Same as root: preserve caret constraints
    versioning-strategy: "increase"
    labels:
      - "dependencies"
      - "pub"
      - "example"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"


  # ========== GitHub Actions 版本更新 / GitHub Actions updates ==========
  # 检查 .github/workflows/ 中使用的 actions/xxx@vN 版本
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Shanghai"
    groups:
      # 所有 actions 更新聚合到一个 PR / Group all actions updates into one PR
      all-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
