name: Publish to pub.dev

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']  # e.g. v1.1.0, v1.1.1

# 发布任务需要通过 CI 检查后才能运行
# Publish job requires CI to pass first
jobs:
  # Reuse CI workflow as prerequisite
  ci-check:
    name: CI Check
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish:
    name: Publish to pub.dev
    needs: ci-check
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 用于创建 GitHub Release / for creating GitHub Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Keep in sync with ci.yml (flutter-version: '3.41.7') so the pre-publish
          # `dart format` check (run via the reused ci.yml) uses the same formatter.
          # 与 ci.yml 保持一致（flutter-version: '3.41.7'），确保发布前复用的
          # ci.yml 跑的 dart format 使用同一 formatter。
          flutter-version: '3.41.7'
          cache: true

      # ========== 发布前校验 / Pre-publish validation ==========

      - name: Extract tag version
        id: extract-tag
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"  # e.g. "v1.1.0"
          VERSION="${TAG_NAME#v}"         # e.g. "1.1.0"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify version matches pubspec.yaml
        run: |
          PUBSPEC_VERSION=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          TAG_VERSION="${{ steps.extract-tag.outputs.version }}"
          if [ "$PUBSPEC_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::pubspec.yaml version ($PUBSPEC_VERSION) does not match tag version ($TAG_VERSION)"
            exit 1
          fi
          echo "✅ Version match: $PUBSPEC_VERSION"

      - name: Verify CHANGELOG has version entry
        run: |
          TAG_VERSION="${{ steps.extract-tag.outputs.version }}"
          if ! grep -qE "^## ${TAG_VERSION}($| )" CHANGELOG.md; then
            echo "::error::CHANGELOG.md is missing entry for version $TAG_VERSION"
            exit 1
          fi
          echo "✅ CHANGELOG has entry for $TAG_VERSION"

      - name: Install dependencies
        run: flutter pub get

      - name: Dry-run pub publish validation
        run: |
          set -o pipefail
          dart pub publish --dry-run | tee /tmp/zik_dryrun.txt
          # `dart pub publish --dry-run` does NOT verify that files referenced by
          # pubspec.yaml `screenshots` are actually INSIDE the archive. pub.dev
          # rejects the upload server-side ("Screenshot ... is missing from
          # archive"), which a dry-run cannot see — this exact gap made 2.3.0
          # publish twice with a "successful" workflow. Cross-check every
          # declared screenshot against the dry-run file listing.
          # dry-run 不会校验 pubspec.yaml `screenshots` 引用的图片是否被
          # .pubignore 排除；只有 pub.dev 服务端会拒收，2.3.0 曾因此连发两次失败。
          python3 - <<'PY'
          import re, sys
          pubspec = open('pubspec.yaml', encoding='utf-8').read()
          listing = open('/tmp/zik_dryrun.txt', encoding='utf-8').read()
          block = re.search(r'(?ms)^screenshots:\s*\n(.*?)(?=^\S|\Z)', pubspec)
          if not block:
              sys.exit('::error::Could not parse the pubspec.yaml `screenshots:` block')
          paths = re.findall(r'^\s*path:\s*(\S+)\s*$', block.group(1), re.M)
          if not paths:
              sys.exit('::error::No `screenshots: path:` entries found')
          missing = [p for p in paths if p.split('/')[-1] not in listing]
          if missing:
              sys.exit('::error::Screenshots missing from published archive: '
                       + ', '.join(missing)
                       + ' — check .pubignore (image/screenshot/ must NOT be excluded)')
          print('OK: all %d declared screenshots are present in the archive' % len(paths))
          PY

      # ========== 正式发布到 pub.dev / Actual publish to pub.dev ==========
      # 社区成熟 Action：k-paxian/dart-package-publisher（内部自动处理 OAuth2 credentials）
      # Community-maintained Action that internally handles OAuth2 credentials

      - name: Publish to pub.dev
        uses: k-paxian/dart-package-publisher@v1.6
        with:
          # 读取 pub-credentials.json 的完整内容（从 Secret PUB_CREDENTIALS_JSON 注入）
          # Read full content of pub-credentials.json (injected from Secret PUB_CREDENTIALS_JSON)
          accessToken: ${{ fromJson(secrets.PUB_CREDENTIALS_JSON).accessToken }}
          refreshToken: ${{ fromJson(secrets.PUB_CREDENTIALS_JSON).refreshToken }}
          # 跳过格式和静态分析（已在 CI 中检查过）
          # Skip format and static analysis (already verified in CI)
          flutter: true
          skipTests: true
          # MUST stay false: with `force: true` the action swallowed a failed
          # upload ("Failed to update packages") and the job still reported
          # success, so a GitHub Release was created for a version that never
          # reached pub.dev. The explicit verification below is the second guard.
          # 必须为 false：此前 force: true 会吞掉上传失败，job 仍显示 success，
          # 于是 pub.dev 上根本没有这个版本却创建了 Release。
          force: false

      - name: Verify the version is live on pub.dev
        run: |
          VERSION="${{ steps.extract-tag.outputs.version }}"
          # pub.dev 提示索引最长可能 10 分钟，给 30 x 10s = 5 分钟窗口。
          # pub.dev says indexing can take up to 10 minutes; allow a 5-minute window.
          for i in $(seq 1 30); do
            if curl -fsS "https://pub.dev/api/packages/zero_inspector_kit/versions/$VERSION" -o /dev/null; then
              echo "OK: zero_inspector_kit $VERSION is live on pub.dev"
              exit 0
            fi
            echo "Waiting for pub.dev index ($i/12) ..."
            sleep 10
          done
          echo "::error::Publish reported success but $VERSION is not on pub.dev"
          exit 1

      # ========== 创建 GitHub Release ==========
      # 只在上一步确认 pub.dev 已收录该版本后才创建，避免"有 Release 没包"。
      # Only runs after the version is confirmed on pub.dev, so there can never
      # be a GitHub Release without a published package.

      - name: Extract CHANGELOG entry for this version
        id: changelog
        run: |
          TAG_VERSION="${{ steps.extract-tag.outputs.version }}"
          # Extract between "## X.Y.Z" and next "##" heading
          AWK_PROG='
            /^## [0-9]+\.[0-9]+\.[0-9]+/ {
              if (found) { exit }
              if (match($0, /^## ([0-9]+\.[0-9]+\.[0-9]+)/, m) && m[1] == "'"$TAG_VERSION"'") { found = 1; next }
            }
            found { print }
          '
          awk "$AWK_PROG" CHANGELOG.md > release_notes.md
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release v${{ steps.extract-tag.outputs.version }}
          tag_name: ${{ steps.extract-tag.outputs.tag_name }}
          body_path: release_notes.md
          generate_release_notes: false
