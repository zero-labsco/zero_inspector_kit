name: CI

on:
  push:
    branches: [main, 'v*.*.*']
  pull_request:
    branches: [main]
  # 支持被其他工作流复用（如 pub-publish.yml）
  # Support being reused by other workflows (e.g. pub-publish.yml)
  workflow_call:

# 允许仅保留最新的同分支运行，取消旧的运行
# Allow only keeping the latest run per branch, cancel older runs
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Print Flutter version
        run: flutter --version

      # ========== 插件本体 / Plugin itself ==========

      - name: Install plugin dependencies
        run: flutter pub get

      - name: Check plugin formatting
        run: dart format --set-exit-if-changed lib/

      - name: Run static analysis on plugin
        run: flutter analyze lib/

      - name: Run plugin unit tests
        run: flutter test

      # ========== Example 应用 / Example app ==========

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Check example formatting
        working-directory: example
        run: dart format --set-exit-if-changed lib/

      - name: Run static analysis on example
        working-directory: example
        run: flutter analyze lib/
