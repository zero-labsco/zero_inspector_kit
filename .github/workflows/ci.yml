name: CI

on:
  push:
    branches: ['v*.*.*']
    # 仅核心代码变更触发 CI，跳过纯文档/资源文件提交
    # Only trigger CI for core code changes, skip pure doc/asset commits
    paths-ignore:
      - '**.md'              # All markdown files (README, CHANGELOG, wiki, etc.)
      - 'wiki/**'            # Wiki documentation directory
      # 精细化忽略 GitHub 配置，但保留 workflows/ 目录的 CI 触发（Dependabot 改 action 版本需要跑 CI）
      # Finer-grained GitHub ignores — workflows MUST trigger CI (Dependabot action updates need CI)
      - '.github/ISSUE_TEMPLATE/**'     # Issue/PR templates
      - '.github/dependabot.yml'        # Dependabot config itself (doesn't affect builds)
      - '.github/workflows/stale.yml'   # Stale bot doesn't affect builds/publish
      - '**.png'             # PNG images
      - '**.jpg'             # JPG images
      - '**.jpeg'            # JPEG images
      - '**.gif'             # GIF images
      - '**.webp'            # WebP images
      - '**.svg'             # SVG vector files
      - '**.ico'             # Icon files
      - '**.txt'             # Text files
      - '**.gitignore'       # Git ignore files
      - 'LICENSE'            # License file
      - 'README*.md'         # README files (already covered by **.md, but explicit for clarity)
      - 'CHANGELOG.md'       # Changelog (already covered by **.md)
      - 'TODO.md'            # Todo file (already covered by **.md)
      - '.metadata'          # Package metadata (non-critical for CI validation)
      - 'example/lib/main.dart'  # Example entry point (CI checks example lib/ separately)
      - 'example/test/**'    # Example tests (not part of core plugin validation)
      - 'example/ios/Flutter/**' # Flutter-generated iOS files
      - 'example/android/**'    # Example Android build artifacts
      - 'example/ios/Runner.xcodeproj/**' # Xcode project files (auto-generated)
  pull_request:
    branches: [main]
    # Apply same ignore rules for PRs
    # 对 PR 应用相同的忽略规则
    paths-ignore:
      - '**.md'
      - 'wiki/**'
      # 精细化忽略 GitHub 配置，但保留 workflows/ 目录的 CI 触发
      # Finer-grained GitHub ignores — workflows MUST trigger CI
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/dependabot.yml'
      - '.github/workflows/stale.yml'
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '**.gif'
      - '**.webp'
      - '**.svg'
      - '**.ico'
      - '**.txt'
      - '**.gitignore'
      - 'LICENSE'
      - 'README*.md'
      - 'CHANGELOG.md'
      - 'TODO.md'
      - '.metadata'
      - 'example/lib/main.dart'
      - 'example/test/**'
      - 'example/ios/Flutter/**'
      - 'example/android/**'
      - 'example/ios/Runner.xcodeproj/**'
  # main 分支手动触发 / Manual trigger for main branch
  workflow_dispatch:
  # 支持被其他工作流复用（如 pub-publish.yml）
  # Support being reused by other workflows (e.g. pub-publish.yml)
  workflow_call:

# 允许仅保留最新的同分支运行，取消旧的运行
# Allow only keeping the latest run per branch, cancel older runs
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Print Flutter version
        run: flutter --version

      # ========== 插件本体 / Plugin itself ==========

      - name: Install plugin dependencies
        run: flutter pub get

      - name: Check plugin formatting
        run: dart format --set-exit-if-changed lib/

      - name: Run static analysis on plugin
        run: flutter analyze lib/

      - name: Run plugin unit tests
        run: flutter test

      # ========== Example 应用 / Example app ==========

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Check example formatting
        working-directory: example
        run: dart format --set-exit-if-changed lib/

      - name: Run static analysis on example
        working-directory: example
        run: flutter analyze lib/

      # ========== pub.dev 评分自检 / pub.dev score self-check ==========
      # 使用 pana 确保评分 ≥ 120，防止提交导致 pub.dev 评分下降
      # Uses pana to ensure score ≥ 120, preventing pub.dev score regression

      - name: Run pana pub.dev score check
        run: |
          dart pub global activate pana
          # 运行 pana：--no-warning 在有警告时以非零退出；用 set +e 防止 GitHub 默认的
          # set -e 直接终止，确保后续仍能解析并展示分数
          # Run pana: --no-warning exits non-zero on warnings; disable set -e so we
          # can still parse and report the score afterward
          set +e
          dart pub global run pana --no-warning --json . > pana.json
          PANA_EXIT=$?
          set -e
          if [ $PANA_EXIT -ne 0 ]; then
            echo "::error::pana reported warnings/errors (exit code $PANA_EXIT)"
            cat pana.json
            exit 1
          fi
          # pana 0.22+ 将分数嵌套在 scores 对象下：scores.grantedPoints
          # pana 0.22+ nests the score under the 'scores' object: scores.grantedPoints
          SCORE=$(python3 -c "import json; d=json.load(open('pana.json')); s=d.get('scores', d); print(s['grantedPoints'])")
          MAX=$(python3 -c "import json; d=json.load(open('pana.json')); s=d.get('scores', d); print(s['maxPoints'])")
          echo "pana score: $SCORE / $MAX"
          if [ "$SCORE" -lt 120 ]; then
            echo "::error::pana score ($SCORE/$MAX) is below the 120 threshold"
            exit 1
          fi
          echo "✅ pana score ($SCORE/$MAX) meets the 120 threshold"
