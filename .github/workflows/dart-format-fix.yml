name: Dart Format Auto-Fix

# Automatically run `dart format` on PRs and push fixes back when the code is
# not properly formatted. This keeps style consistent without reviewer nudging.
#
# 对 PR 自动执行 `dart format`；格式不合规时由 bot 自动提交修复，
# 避免 reviewer 反复挑格式问题。
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  # Allow manual runs from the Actions tab (formats the default branch).
  # 允许在 Actions 页手动触发（对默认分支执行格式化）。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    name: Auto-format Dart code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          # Use the PR's head ref so we can push fixes back to the same branch.
          # 使用 PR 的 head ref，以便把修复推回同一分支。
          ref: ${{ github.head_ref }}
          # Fetch full history so renormalization can rewrite blobs if needed.
          # 拉取完整历史，便于在需要时重新规范化 blob。
          fetch-depth: 0

      - name: Normalize line endings to LF
        # Ensure every checked-out file is LF so `dart format` produces the same
        # result locally and on CI (Windows CRLF in history causes the format
        # job to loop forever). `.gitattributes` already requests `eol=lf`; this
        # step makes checkout honor it retroactively for existing blobs.
        # 强制所有文件为 LF，避免 Windows CRLF 历史导致 dart format 反复改动。
        run: |
          git config core.autocrlf false
          git config core.eol lf
          # `git add --renormalize .` updates the index, but the working tree on
          # disk may still hold CRLF (from a CRLF historical blob). Force the LF
          # version out to disk, otherwise the later `dart format` reads CRLF and
          # re-emits LF, looping forever. Only commit if the on-disk content of a
          # tracked file actually differs from the committed blob.
          # 只更新 index 不够，磁盘上可能仍是 CRLF；必须强制落盘为 LF，
          # 否则后续 dart format 读 CRLF 又写成 LF，陷入死循环。
          git add --renormalize .
          git checkout -f -- .
          # Compare what would actually be committed (LF on disk) against the
          # committed blob; commit only when they differ.
          # 对比磁盘 LF 内容与实际 blob，仅在不一致时提交。
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "style: normalize line endings to LF" && git push
          else
            echo "Line endings already normalized."
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Format code
        run: dart format .

      - name: Commit and push fixes
        # Only commit if dart format actually changed something.
        # 仅当 dart format 确实产生了改动时才提交。
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "style: auto-format with dart format"
            git push
          else
            echo "No formatting changes needed."
          fi
