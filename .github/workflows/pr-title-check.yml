name: PR Title Check

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: read

jobs:
  check-title:
    name: Check PR Title (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title format
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 允许的提交类型 / Allowed commit types
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          # 要求至少包含一个 scope / Require at least one scope
          requireScope: false
          # 允许破坏性变更标记 / Allow breaking change marker
          allowBreakingChanges: true
          # 忽略特定标签的 PR（如 dependabot）
          # Ignore PRs with specific labels
          ignoreLabels: |
            dependencies
            github-actions
