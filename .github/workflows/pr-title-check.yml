name: PR Title Check

on:
  # `pull_request_target` runs with a write-capable token on the *base* branch and
  # is restricted by GitHub's default event policy on public repositories from
  # 2026-12-02. This job only READS the PR title (amannn/action-semantic-pull-request
  # needs `pull-requests: read`, nothing more), so `pull_request` is both safer
  # and unaffected by that policy change.
  # 该 job 只读取 PR 标题，不需要写权限；改用 pull_request 避免 2026-12-02 起
  # 公共仓库默认策略阻断 pull_request_target，导致这个 required check 消失。
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  pull-requests: read

jobs:
  check-title:
    name: Check PR Title (Conventional Commits)
    runs-on: ubuntu-latest
    # Re-run on `synchronize` so the title check is reported again on the new
    # head commit (otherwise it shows as pending/yellow after a human re-push).
    # Skip the bot's own sync commit from `dart-format-fix` to avoid a loop and
    # to keep the status green: the title never changes on a format-only push.
    # 恢复 `synchronize`:人类再次 push 时,标题检查会在新 head commit 上重跑,
    # 否则该 check 在新 commit 上缺条目、显示为黄色 pending。同时用 actor 条件
    # 跳过 dart-format-fix 的 bot 同步提交,避免循环触发且标题本来不会变。
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Validate PR title format
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 允许的提交类型 / Allowed commit types
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          # 要求至少包含一个 scope / Require at least one scope
          requireScope: false
          # 忽略特定标签的 PR（如 dependabot）
          # Ignore PRs with specific labels
          ignoreLabels: |
            dependencies
            github-actions
