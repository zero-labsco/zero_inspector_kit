name: zero_inspector_kit_example
description: "Demonstrates how to use the zero_inspector_kit plugin."
publish_to: 'none'

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  zero_inspector_kit: 
    path: ../


  dio: 5.11.0
  http: 1.6.0
  cupertino_icons: 1.0.9
  logger: 2.7.0
  sqflite: ^2.4.0
  path: '1.9.1'
  shared_preferences: ^2.3.0
  hive: ^2.2.0
  path_provider: ^2.1.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: '6.0.0'

flutter:
  uses-material-design: true