name: zero_inspector_kit_example
description: "Demonstrates how to use the zero_inspector_kit plugin."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  zero_inspector_kit: 
    path: ../


  dio: 5.11.0
  http: 1.6.0
  cupertino_icons: 1.0.9
  logger: 2.7.0
  sqflite: ^2.4.0
  path: '1.9.1'
  shared_preferences: ^2.3.0
  hive: ^2.2.0
  path_provider: ^2.1.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: '6.0.0'

flutter:
  uses-material-design: true

# --- Zero Inspector Kit demo config ---
# This demonstrates opting a release (AOT) build into the inspector for QA.
# In a real host app, add this to YOUR app's pubspec.yaml (the app that depends
# on this package) and build with:
#   flutter build apk --release --dart-define=INSPECTOR_MODES=all
# (or run `dart run zero_inspector_kit:build_inspector build apk --release` — the helper ships with the package).
zero_inspector_kit:
  inspector_modes: all