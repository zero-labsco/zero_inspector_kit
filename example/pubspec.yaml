name: zero_inspector_kit_example
description: "Demonstrates how to use the zero_inspector_kit plugin."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  zero_inspector_kit: 
    path: ../


  dio: 5.11.0
  http: 1.6.0
  cupertino_icons: 1.0.9
  logger: 2.7.0
  # 与 zero_inspector_kit 的后端保持一致：sqflite 官方版在 OpenHarmony 上无原生实现，
  # 改用已适配 ohos 的 sqflite_sqlcipher（不传 password 即为明文 SQLite，类型/参数完全兼容）。
  # Keep the backend aligned with zero_inspector_kit: the official sqflite has no
  # OpenHarmony native implementation, so we use the ohos-ready sqflite_sqlcipher
  # (plain SQLite when no password is given; API-compatible with sqflite).
  sqflite_sqlcipher:
    git:
      url: https://atomgit.com/flutter_ohos_plugin/sqflite_sqlcipher.git
      ref: d8835f7aaa9daecde2ab097fb374d025600aab93
  path: '1.9.1'
  shared_preferences: ^2.3.0
  hive: ^2.2.0
  path_provider: ^2.1.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: '6.0.0'

flutter:
  uses-material-design: true